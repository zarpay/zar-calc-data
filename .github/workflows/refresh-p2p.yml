name: Refresh P2P rates

on:
  schedule:
    - cron: '0 * * * *'  # hourly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-p2p
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2

      - uses: actions/setup-node@1a3992acdc746f0e8c42d88e2e5e8547af17e39c   # v4.1.0
        with:
          node-version: '20'

      - name: Fetch P2P rates from Binance/Bybit/OKX
        run: node scripts/fetch-p2p.js --json-only > p2p.json

      - name: Validate JSON
        run: |
          jq -e . p2p.json > /dev/null
          echo "Fetched $(jq '.results | length' p2p.json) currencies. Sample:"
          jq '.results | to_entries | .[0:3]' p2p.json

      - name: Commit and push if changed
        permissions:
          contents: write
        run: |
          if git diff --quiet -- p2p.json; then
            echo "No changes to p2p.json - skipping commit."
            exit 0
          fi
          git config user.name "p2p-refresh-bot"
          git config user.email "noreply@zarpay.app"
          git add p2p.json
          git commit -m "Refresh P2P rates ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push || { git pull --rebase --autostash origin HEAD && git push; }
